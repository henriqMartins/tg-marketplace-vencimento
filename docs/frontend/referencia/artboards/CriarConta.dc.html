<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar conta</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #1B1F1C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px;">
    <a href="Entrar.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700;">Criar conta</h1>
  </header>

  <form style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 0;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="nome" style="font-size: 14px; font-weight: 600;">Nome</label>
      <input id="nome" autocomplete="name" value="Ana Souza" style="height: 52px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid #C9C6BC; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B1F1C;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 14px; font-weight: 600;">E-mail</label>
      <input id="email" type="email" autocomplete="email" value="ana.souza@email.com" style="height: 52px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid #C9C6BC; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B1F1C;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="senha" style="font-size: 14px; font-weight: 600;">Senha</label>
      <input id="senha" type="password" autocomplete="new-password" value="senha1234" aria-describedby="dica" style="height: 52px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid #C9C6BC; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B1F1C;">
      <span id="dica" style="font-size: 13px; color: #5B635D;">Pelo menos 8 caracteres.</span>
    </div>
    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; padding: 4px 0;">
      <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #1E6A48; flex-shrink: 0;">
      <span>Li e aceito os termos de uso. Meus dados são usados só para as reservas.</span>
    </label>
    <div style="display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: #E3F0E8; color: #14503A; font-size: 14px; line-height: 1.45;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      <span>Trabalha numa loja parceira? Crie a conta normalmente. O responsável da loja vincula você pelo seu e-mail.</span>
    </div>
  </form>

  <footer style="padding: 12px 20px 28px;">
    <a href="Permissoes.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1E6A48; color: #FFFFFF; font-size: 17px; font-weight: 700;">Criar conta</a>
  </footer>
</div>
</x-dc>

</script>
</body>
</html>
