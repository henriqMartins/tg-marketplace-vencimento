<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conferência na gôndola</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Nunito:wght@400;600;700;800;900&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.font}}; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; background: {{t.surface}}; border-bottom: 1px solid {{t.line}};">
    <a href="Avisos.dc.html" aria-label="Voltar aos avisos" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{t.ink}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700;">Conferir zona</h1>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px; overflow: hidden;">
    <section style="display: flex; align-items: center; gap: 14px; padding: 16px; background: {{t.surface}}; border: 1.5px solid {{t.line}}; border-radius: 16px;">
      <div aria-hidden="true" style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 16px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #9A968A;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 18px; font-weight: 800;">Iogurte natural 170 g</span>
        <span style="font-size: 15px;">Zona <strong>Branco</strong> · set–out</span>
        <span style="font-size: 15px;">Data mais próxima: <strong>28/10/2026</strong></span>
      </div>
    </section>

    <p style="margin: 0; font-size: 15px; line-height: 1.45;">Vá à zona <strong>Branco</strong> da gôndola e conte as unidades que vão para a oferta.</p>

    <div role="group" aria-labelledby="contadas" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 12px; background: {{t.surface}}; border: 1.5px solid {{t.lineStrong}}; border-radius: 20px;">
      <span id="contadas" style="font-size: 14px; font-weight: 600; color: {{t.muted}};">Unidades contadas</span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;">
        <button onClick="{{menos}}" aria-label="Diminuir" style="width: 96px; height: 96px; border: none; border-radius: 20px; background: {{t.primarySoft}}; color: {{t.primary}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <span style="font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">{{qtd}}</span>
        <button onClick="{{mais}}" aria-label="Aumentar" style="width: 96px; height: 96px; border: none; border-radius: 20px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span id="desc-label" style="font-size: 14px; font-weight: 600;">Desconto da oferta</span>
      <div role="group" aria-labelledby="desc-label" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{descontos}}" as="d" hint-placeholder-count="4">
          <button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="{{d.style}}">{{d.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 14px; color: {{t.muted}};">De <s>R$ 4,49</s> por <strong style="color: {{t.ink}};">{{preco}}</strong> a unidade</span>
    </div>
  </main>

  <footer style="display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 24px;">
    <a href="Publicar.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; box-sizing: border-box; border-radius: 14px; background: {{t.primary}}; color: {{t.onPrimary}}; font-size: 17px; font-weight: 700; text-decoration: none;">Continuar para publicar</a>
    <a href="ConferenciaEstados.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid {{t.lineStrong}}; border-radius: 14px; background: {{t.surface}}; color: {{t.ink}}; font-size: 16px; font-weight: 600; text-decoration: none;">Adiar aviso</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"identidade":{"editor":"enum","options":["Prazo Certo","Vale Hoje","Bairro Bom","Resgate","Original (verde)"],"default":"Original (verde)"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { qtd: 12, desc: 30 }; }
  renderVals() {
    const TH = {
      'Prazo Certo': { font: "'Manrope', system-ui, sans-serif", bg: '#F2F6F5', surface: '#FFFFFF', ink: '#0F1E20', muted: '#51666A', line: '#DCE6E5', lineStrong: '#B9CCCB', primary: '#0E5C63', primaryDark: '#0A464C', primarySoft: '#DDF0EE', onPrimary: '#FFFFFF', accent: '#D9F35B', onAccent: '#1A2B0A', phBg: '#E3ECEB', phFg: '#7C9396' },
      'Vale Hoje': { font: "'Bricolage Grotesque', system-ui, sans-serif", bg: '#FFF8F3', surface: '#FFFFFF', ink: '#231A17', muted: '#6B5D57', line: '#F0E2DA', lineStrong: '#D9C4B8', primary: '#C8372D', primaryDark: '#9E2A22', primarySoft: '#FCE9E4', onPrimary: '#FFFFFF', accent: '#1F2A44', onAccent: '#FFFFFF', phBg: '#F6E8DF', phFg: '#A88E80' },
      'Bairro Bom': { font: "'Nunito', system-ui, sans-serif", bg: '#FBF5EC', surface: '#FFFDF9', ink: '#2A1E16', muted: '#6E5E52', line: '#EBDFD0', lineStrong: '#D4C3AF', primary: '#A6411F', primaryDark: '#7F3016', primarySoft: '#F7E6DC', onPrimary: '#FFFFFF', accent: '#E9B23A', onAccent: '#2A1B0F', phBg: '#F1E6D6', phFg: '#A08C76' },
      'Resgate': { font: "'Space Grotesk', system-ui, sans-serif", bg: '#F5F5FA', surface: '#FFFFFF', ink: '#16152B', muted: '#5A5975', line: '#E2E1EE', lineStrong: '#C4C3D8', primary: '#3730A3', primaryDark: '#28237A', primarySoft: '#E7E6FB', onPrimary: '#FFFFFF', accent: '#F59E0B', onAccent: '#2A1A00', phBg: '#E8E7F3', phFg: '#8A89A6' },
      'Original (verde)': { font: "'Plus Jakarta Sans', system-ui, sans-serif", bg: '#F6F5F1', surface: '#FFFFFF', ink: '#1B1F1C', muted: '#5B635D', line: '#E3E1DA', lineStrong: '#C9C6BC', primary: '#1E6A48', primaryDark: '#14503A', primarySoft: '#E3F0E8', onPrimary: '#FFFFFF', accent: '#C2410C', onAccent: '#FFFFFF', phBg: '#EDEBE4', phFg: '#8A8678' }
    };
    const t = TH[this.props.identidade] || TH['Original (verde)'];
    const base = 'height: 52px; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; ';
    const on = base + 'border: 2px solid ' + t.primary + '; background: ' + t.primary + '; color: ' + t.onPrimary + ';';
    const off = base + 'border: 1.5px solid ' + t.lineStrong + '; background: ' + t.surface + '; color: ' + t.ink + ';';
    const preco = (4.49 * (1 - this.state.desc / 100)).toFixed(2).replace('.', ',');
    return {
      t: t,
      qtd: this.state.qtd,
      menos: () => this.setState({ qtd: Math.max(0, this.state.qtd - 1) }),
      mais: () => this.setState({ qtd: this.state.qtd + 1 }),
      preco: 'R$ ' + preco,
      descontos: [20, 30, 40, 50].map((v) => ({
        label: v + '%',
        on: this.state.desc === v,
        style: this.state.desc === v ? on : off,
        pick: () => this.setState({ desc: v })
      }))
    };
  }
}
</script>
</body>
</html>
