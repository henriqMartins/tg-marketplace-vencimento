<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lotes e fitas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #1B1F1C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E3E1DA;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800;">Lotes e fitas</h1>
      <span style="font-size: 14px; color: #5B635D;">Grupos por produto e cor · referência = data mais próxima</span>
    </div>
    <div role="group" aria-label="Filtrar por cor" style="display: flex; gap: 8px; overflow: hidden;">
      <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}"><span aria-hidden="true" style="{{f.dot}}"></span>{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; overflow: hidden;">
    <sc-for list="{{grupos}}" as="g" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px; padding: 12px 14px; background: #FFFFFF; border: 1.5px solid #E3E1DA; border-radius: 16px;">
        <div aria-hidden="true" style="{{g.sw}}"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <div style="display: flex; justify-content: space-between; gap: 8px;">
            <span style="font-size: 15px; font-weight: 700;">{{g.produto}}</span>
            <span style="{{g.badge}}">{{g.estado}}</span>
          </div>
          <span style="font-size: 13px;">Fita <strong>{{g.cor}}</strong> · ref. {{g.ref}} · {{g.lotes}}</span>
          <span style="font-size: 13px; color: #5B635D;">{{g.info}}</span>
          <sc-if value="{{g.colisao}}" hint-placeholder-val="{{ false }}">
            <span style="margin-top: 4px; align-self: flex-start; padding: 3px 8px; border-radius: 8px; background: #FEF3C7; color: #6B3F00; font-size: 12px; font-weight: 700;">Colisão de ciclo: há lote Preto de 2025 ativo</span>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </main>

  <a href="Main.dc.html" style="position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px; border-radius: 28px; background: #1E6A48; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 16px rgba(20,80,58,0.3);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Cadastrar lote</a>

  <nav aria-label="Navegação do lojista" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px; background: #FFFFFF; border-top: 1px solid #E3E1DA;">
    <a href="InicioLoja.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #5B635D;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"></path></svg>Início</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #1E6A48;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path></svg>Lotes</a>
    <a href="Avisos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #5B635D;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg>Avisos</a>
    <a href="ValidarRetirada.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #5B635D;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10v4M11 10v4M15 10v4"></path></svg>Retirada</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cor: 'Todas' }; }
  renderVals() {
    const sw = (bg, b) => 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; box-sizing: border-box; background: ' + bg + '; border: 2px solid ' + b + ';';
    const dot = (bg, b) => 'width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; background: ' + bg + '; border: 1.5px solid ' + b + ';';
    const cores = { Branco: ['#FFFFFF', '#9A968A'], Preto: ['#1B1B1B', '#1B1B1B'], Vermelho: ['#D7263D', '#D7263D'] };
    const badge = (bg, c) => 'padding: 2px 8px; border-radius: 999px; background: ' + bg + '; color: ' + c + '; font-size: 11px; font-weight: 700; white-space: nowrap; align-self: flex-start;';
    const todos = [
      { produto: 'Iogurte natural 170 g', cor: 'Branco', ref: '28/10/2026', lotes: '2 lotes', info: '24 un. recebidas · em oferta desde 22/10', estado: 'Em oferta', b: badge('#E4F1E4', '#1F5B2A') },
      { produto: 'Biscoito recheado 140 g', cor: 'Branco', ref: '29/10/2026', lotes: '1 lote', info: 'Aviso adiado para amanhã', estado: 'Adiado', b: badge('#FEF3C7', '#6B3F00') },
      { produto: 'Requeijão cremoso 200 g', cor: 'Preto', ref: '01/11/2026', lotes: '1 lote', info: 'Aviso disparado hoje · aguardando conferência', estado: 'Conferir', b: badge('#FDE8E7', '#8A1C13') },
      { produto: 'Molho de tomate 300 g', cor: 'Preto', ref: '09/12/2026', lotes: '2 lotes', info: 'Aviso em 29/11 (antecedência de 10 dias)', estado: 'Aguardando', b: badge('#E3F0E8', '#14503A'), colisao: true },
      { produto: 'Chocolate ao leite 90 g', cor: 'Vermelho', ref: '14/02/2027', lotes: '1 lote', info: 'Aviso em 04/02/2027', estado: 'Aguardando', b: badge('#E3F0E8', '#14503A') }
    ];
    const pill = 'height: 36px; padding: 0 12px; flex-shrink: 0; border-radius: 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; ';
    const on = pill + 'border: 1.5px solid #1E6A48; background: #1E6A48; color: #FFFFFF;';
    const off = pill + 'border: 1.5px solid #C9C6BC; background: #FFFFFF; color: #1B1F1C;';
    const lista = todos.filter((g) => this.state.cor === 'Todas' || g.cor === this.state.cor);
    return {
      filtros: ['Todas', 'Branco', 'Preto', 'Vermelho'].map((c) => ({
        label: c, on: this.state.cor === c, style: this.state.cor === c ? on : off,
        dot: c === 'Todas' ? 'display: none;' : dot(cores[c][0], cores[c][1]),
        pick: () => this.setState({ cor: c })
      })),
      grupos: lista.map((g) => Object.assign({}, g, { sw: sw(cores[g.cor][0], cores[g.cor][1]), badge: g.b, colisao: !!g.colisao }))
    };
  }
}
</script>
</body>
</html>
