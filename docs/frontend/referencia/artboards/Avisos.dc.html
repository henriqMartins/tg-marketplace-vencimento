<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lista de avisos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Nunito:wght@400;600;700;800;900&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.font}}; display: flex; flex-direction: column;">
  <header style="display: flex; flex-direction: column; gap: 4px; padding: 20px 16px 14px; background: {{t.surface}}; border-bottom: 1px solid {{t.line}};">
    <span style="font-size: 13px; color: {{t.muted}};">Mercadinho Vila Nova</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800;">Avisos de validade</h1>
    <span style="font-size: 14px; color: {{t.muted}};">5 avisos · antecedência da loja: 10 dias</span>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px; overflow: hidden;">
    <sc-for list="{{avisos}}" as="a" hint-placeholder-count="5">
      <a href="Conferencia.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; min-height: 88px; box-sizing: border-box; background: {{t.surface}}; border: 1.5px solid {{t.line}}; border-radius: 16px; color: {{t.ink}};">
        <div aria-hidden="true" style="{{a.swatch}}"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <span style="font-size: 16px; font-weight: 700;">{{a.produto}}</span>
          <span style="font-size: 14px;">Fita <strong>{{a.cor}}</strong> · vence {{a.data}}</span>
          <span style="{{a.prazoStyle}}">{{a.prazo}}</span>
        </div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{t.muted}};"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Navegação do lojista" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px; background: {{t.surface}}; border-top: 1px solid {{t.line}};">
    <a href="InicioLoja.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: {{t.muted}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"></path></svg>Início</a>
    <a href="Lotes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: {{t.muted}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path></svg>Lotes</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: {{t.primary}};">
      <span style="position: relative; display: flex;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg>
        <span style="position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #B42318; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">5</span>
      </span>Avisos</a>
    <a href="ValidarRetirada.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: {{t.muted}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10v4M11 10v4M15 10v4"></path></svg>Retirada</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;identidade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Prazo Certo&quot;,&quot;Vale Hoje&quot;,&quot;Bairro Bom&quot;,&quot;Resgate&quot;,&quot;Original (verde)&quot;],&quot;default&quot;:&quot;Original (verde)&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const TH = {
      'Prazo Certo': { font: "'Manrope', system-ui, sans-serif", bg: '#F2F6F5', surface: '#FFFFFF', ink: '#0F1E20', muted: '#51666A', line: '#DCE6E5', lineStrong: '#B9CCCB', primary: '#0E5C63', primaryDark: '#0A464C', primarySoft: '#DDF0EE', onPrimary: '#FFFFFF', accent: '#D9F35B', onAccent: '#1A2B0A', phBg: '#E3ECEB', phFg: '#7C9396' },
      'Vale Hoje': { font: "'Bricolage Grotesque', system-ui, sans-serif", bg: '#FFF8F3', surface: '#FFFFFF', ink: '#231A17', muted: '#6B5D57', line: '#F0E2DA', lineStrong: '#D9C4B8', primary: '#C8372D', primaryDark: '#9E2A22', primarySoft: '#FCE9E4', onPrimary: '#FFFFFF', accent: '#1F2A44', onAccent: '#FFFFFF', phBg: '#F6E8DF', phFg: '#A88E80' },
      'Bairro Bom': { font: "'Nunito', system-ui, sans-serif", bg: '#FBF5EC', surface: '#FFFDF9', ink: '#2A1E16', muted: '#6E5E52', line: '#EBDFD0', lineStrong: '#D4C3AF', primary: '#A6411F', primaryDark: '#7F3016', primarySoft: '#F7E6DC', onPrimary: '#FFFFFF', accent: '#E9B23A', onAccent: '#2A1B0F', phBg: '#F1E6D6', phFg: '#A08C76' },
      'Resgate': { font: "'Space Grotesk', system-ui, sans-serif", bg: '#F5F5FA', surface: '#FFFFFF', ink: '#16152B', muted: '#5A5975', line: '#E2E1EE', lineStrong: '#C4C3D8', primary: '#3730A3', primaryDark: '#28237A', primarySoft: '#E7E6FB', onPrimary: '#FFFFFF', accent: '#F59E0B', onAccent: '#2A1A00', phBg: '#E8E7F3', phFg: '#8A89A6' },
      'Original (verde)': { font: "'Plus Jakarta Sans', system-ui, sans-serif", bg: '#F6F5F1', surface: '#FFFFFF', ink: '#1B1F1C', muted: '#5B635D', line: '#E3E1DA', lineStrong: '#C9C6BC', primary: '#1E6A48', primaryDark: '#14503A', primarySoft: '#E3F0E8', onPrimary: '#FFFFFF', accent: '#C2410C', onAccent: '#FFFFFF', phBg: '#EDEBE4', phFg: '#8A8678' }
    };
    const t = TH[this.props.identidade] || TH['Original (verde)'];
    const sw = (bg, borda) => 'width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; box-sizing: border-box; background: ' + bg + '; border: 2px solid ' + borda + ';';
    const branco = sw('#FFFFFF', '#9A968A');
    const preto = sw('#1B1B1B', '#1B1B1B');
    const urg = 'font-size: 13px; font-weight: 700; color: #B42318;';
    const ok = 'font-size: 13px; font-weight: 600; color: ' + t.muted + ';';
    const adi = 'font-size: 13px; font-weight: 600; color: #6B3F00;';
    return {
      t: t,
      avisos: [
        { produto: 'Iogurte natural 170 g', cor: 'Branco', data: '28/10/2026', prazo: 'Faltam 6 dias', swatch: branco, prazoStyle: urg },
        { produto: 'Biscoito recheado 140 g', cor: 'Branco', data: '29/10/2026', prazo: 'Adiado · volta amanhã', swatch: branco, prazoStyle: adi },
        { produto: 'Presunto fatiado 200 g', cor: 'Branco', data: '30/10/2026', prazo: 'Faltam 8 dias', swatch: branco, prazoStyle: ok },
        { produto: 'Queijo muçarela fatiado 150 g', cor: 'Branco', data: '31/10/2026', prazo: 'Faltam 9 dias', swatch: branco, prazoStyle: ok },
        { produto: 'Requeijão cremoso 200 g', cor: 'Preto', data: '01/11/2026', prazo: 'Faltam 10 dias', swatch: preto, prazoStyle: ok }
      ]
    };
  }
}
</script>
</body>
</html>
