<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meu pedido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #1B1F1C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E3E1DA;">
    <a href="Vitrine.dc.html" aria-label="Voltar à vitrine" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column;">
      <h1 style="margin: 0; font-size: 20px; font-weight: 700;">Meu pedido</h1>
      <span style="font-size: 13px; color: #5B635D;">Um código por loja</span>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 20px; overflow: hidden;">
    <div role="note" style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #FEF3C7; color: #6B3F00; font-size: 13px; line-height: 1.45;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <span>Os itens só ficam guardados para você quando você <strong>confirma</strong> o pedido da loja.</span>
    </div>

    <sc-for list="{{lojas}}" as="l" hint-placeholder-count="2">
      <section aria-label="{{l.nome}}" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #FFFFFF; border: 1.5px solid #E3E1DA; border-radius: 16px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800;">{{l.nome}}</h2>
          <span style="font-size: 13px; color: #5B635D;">{{l.dist}}</span>
        </div>
        <sc-for list="{{l.itens}}" as="i" hint-placeholder-count="2">
          <div style="{{i.linha}}">
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 14px; font-weight: 700;">{{i.nome}}</span>
              <span style="{{i.subStyle}}">{{i.sub}}</span>
            </div>
            <sc-if value="{{i.ativo}}" hint-placeholder-val="{{ true }}">
              <div role="group" aria-label="Quantidade de {{i.nome}}" style="display: flex; align-items: center; gap: 6px;">
                <button onClick="{{i.menos}}" aria-label="Diminuir" style="width: 36px; height: 36px; border: none; border-radius: 10px; background: #E3F0E8; color: #1E6A48; font: inherit; font-size: 20px; font-weight: 800; cursor: pointer;">−</button>
                <span style="min-width: 20px; text-align: center; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums;">{{i.qtd}}</span>
                <button onClick="{{i.mais}}" aria-label="Aumentar" style="width: 36px; height: 36px; border: none; border-radius: 10px; background: #1E6A48; color: #FFFFFF; font: inherit; font-size: 20px; font-weight: 800; cursor: pointer;">+</button>
              </div>
            </sc-if>
            <sc-if value="{{i.esgotado}}" hint-placeholder-val="{{ false }}">
              <button style="height: 36px; padding: 0 12px; border: 1.5px solid #E7B4AE; border-radius: 10px; background: #FFFFFF; color: #A3261B; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">Remover</button>
            </sc-if>
          </div>
        </sc-for>
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid #E3E1DA;">
          <span style="font-size: 14px;">Total na loja</span>
          <span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums;">{{l.total}}</span>
        </div>
        <a href="ReservaResultado.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 12px; background: #1E6A48; color: #FFFFFF; font-size: 16px; font-weight: 700;">Confirmar pedido nesta loja</a>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { iog: 2, pre: 1, bis: 3 }; }
  renderVals() {
    const real = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
    const linha = 'display: flex; align-items: center; gap: 10px;';
    const item = (chave, nome, preco, livre) => {
      const q = this.state[chave];
      return {
        nome: nome, qtd: q, ativo: true, esgotado: false, linha: linha,
        sub: real(preco) + ' cada · ' + livre + ' disponíveis', subStyle: 'font-size: 12px; color: #5B635D;',
        total: q * preco,
        menos: () => this.setState({ [chave]: Math.max(1, q - 1) }),
        mais: () => this.setState({ [chave]: Math.min(livre, q + 1) })
      };
    };
    const esgotado = { nome: 'Requeijão cremoso 200 g', qtd: 0, ativo: false, esgotado: true, linha: linha + ' opacity: 0.6;', sub: 'Esgotou depois que você adicionou', subStyle: 'font-size: 12px; font-weight: 700; color: #A3261B;', total: 0 };
    const vila = [item('iog', 'Iogurte natural 170 g', 3.14, 12), item('pre', 'Presunto fatiado 200 g', 6.90, 6), esgotado];
    const emporio = [item('bis', 'Biscoito recheado 140 g', 2.39, 18)];
    const soma = (xs) => real(xs.reduce((s, x) => s + x.total, 0));
    return {
      lojas: [
        { nome: 'Mercadinho Vila Nova', dist: '0,8 km', itens: vila, total: soma(vila) },
        { nome: 'Empório Santa Rita', dist: '1,4 km', itens: emporio, total: soma(emporio) }
      ]
    };
  }
}
</script>
</body>
</html>
