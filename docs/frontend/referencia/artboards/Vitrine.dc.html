<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vitrine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Nunito:wght@400;600;700;800;900&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.font}}; display: flex; flex-direction: column;">
  <header style="display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 12px; background: {{t.surface}}; border-bottom: 1px solid {{t.line}};">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; color: {{t.muted}};">Ofertas perto de você</span>
      <button style="display: flex; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; font: inherit; font-size: 16px; font-weight: 700; color: {{t.ink}}; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{t.primary}};"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        Boa Vista · CEP 15025-000
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <a href="Pedido.dc.html" aria-label="Meu pedido, 4 itens" style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: {{t.primarySoft}}; color: {{t.primary}}; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 13H5L6 7z"></path><path d="M9 7a3 3 0 016 0"></path></svg>
      <span style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;">4</span>
    </a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: {{t.bg}}; border: 1.5px solid {{t.line}}; border-radius: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: {{t.muted}};"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="busca" style="position: absolute; left: -9999px;">Buscar produto</label>
      <input id="busca" placeholder="Buscar produto" style="flex-grow: 1; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: {{t.ink}}; min-width: 0;">
    </div>
    <div role="group" aria-label="Categoria" style="display: flex; gap: 8px; overflow: hidden;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div role="group" aria-label="Faixa de desconto" style="display: flex; gap: 8px;">
      <sc-for list="{{faixas}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; overflow: hidden;">
    <span style="font-size: 13px; color: {{t.muted}};">{{total}} ofertas · ordenadas por distância</span>
    <sc-for list="{{ofertas}}" as="o" hint-placeholder-count="4">
      <a href="Reserva.dc.html" style="display: flex; gap: 12px; padding: 12px; background: {{t.surface}}; border: 1.5px solid {{t.line}}; border-radius: 16px; color: {{t.ink}};">
        <div aria-hidden="true" style="position: relative; width: 84px; height: 84px; flex-shrink: 0; border-radius: 12px; background: {{t.phBg}}; display: flex; align-items: center; justify-content: center; color: {{t.phFg}};">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8M12 13v8"></path></svg>
          <span style="position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 6px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 12px; font-weight: 800;">−{{o.desc}}%</span>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <span style="font-size: 15px; font-weight: 700;">{{o.nome}}</span>
          <span style="font-size: 13px; color: {{t.muted}};">{{o.loja}} · {{o.dist}}</span>
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span style="font-size: 18px; font-weight: 800; color: {{t.primary}};">{{o.preco}}</span>
            <s style="font-size: 13px; color: {{t.muted}};">{{o.de}}</s>
          </div>
          <span style="font-size: 13px;">Vence {{o.vence}} · <strong>{{o.livre}}</strong> disponíveis</span>
        </div>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Navegação do consumidor" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 8px 20px; background: {{t.surface}}; border-top: 1px solid {{t.line}};">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: {{t.primary}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v11h16V9"></path><path d="M3 9h18"></path></svg>Vitrine</a>
    <a href="MinhasReservas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: {{t.muted}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-4z"></path></svg>Reservas</a>
    <a href="Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: {{t.muted}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0116 0"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"identidade":{"editor":"enum","options":["Prazo Certo","Vale Hoje","Bairro Bom","Resgate","Original (verde)"],"default":"Original (verde)"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cat: 'Todos', faixa: 'Todas' }; }
  renderVals() {
    const TH = {
      'Prazo Certo': { font: "'Manrope', system-ui, sans-serif", bg: '#F2F6F5', surface: '#FFFFFF', ink: '#0F1E20', muted: '#51666A', line: '#DCE6E5', lineStrong: '#B9CCCB', primary: '#0E5C63', primaryDark: '#0A464C', primarySoft: '#DDF0EE', onPrimary: '#FFFFFF', accent: '#D9F35B', onAccent: '#1A2B0A', phBg: '#E3ECEB', phFg: '#7C9396' },
      'Vale Hoje': { font: "'Bricolage Grotesque', system-ui, sans-serif", bg: '#FFF8F3', surface: '#FFFFFF', ink: '#231A17', muted: '#6B5D57', line: '#F0E2DA', lineStrong: '#D9C4B8', primary: '#C8372D', primaryDark: '#9E2A22', primarySoft: '#FCE9E4', onPrimary: '#FFFFFF', accent: '#1F2A44', onAccent: '#FFFFFF', phBg: '#F6E8DF', phFg: '#A88E80' },
      'Bairro Bom': { font: "'Nunito', system-ui, sans-serif", bg: '#FBF5EC', surface: '#FFFDF9', ink: '#2A1E16', muted: '#6E5E52', line: '#EBDFD0', lineStrong: '#D4C3AF', primary: '#A6411F', primaryDark: '#7F3016', primarySoft: '#F7E6DC', onPrimary: '#FFFFFF', accent: '#E9B23A', onAccent: '#2A1B0F', phBg: '#F1E6D6', phFg: '#A08C76' },
      'Resgate': { font: "'Space Grotesk', system-ui, sans-serif", bg: '#F5F5FA', surface: '#FFFFFF', ink: '#16152B', muted: '#5A5975', line: '#E2E1EE', lineStrong: '#C4C3D8', primary: '#3730A3', primaryDark: '#28237A', primarySoft: '#E7E6FB', onPrimary: '#FFFFFF', accent: '#F59E0B', onAccent: '#2A1A00', phBg: '#E8E7F3', phFg: '#8A89A6' },
      'Original (verde)': { font: "'Plus Jakarta Sans', system-ui, sans-serif", bg: '#F6F5F1', surface: '#FFFFFF', ink: '#1B1F1C', muted: '#5B635D', line: '#E3E1DA', lineStrong: '#C9C6BC', primary: '#1E6A48', primaryDark: '#14503A', primarySoft: '#E3F0E8', onPrimary: '#FFFFFF', accent: '#C2410C', onAccent: '#FFFFFF', phBg: '#EDEBE4', phFg: '#8A8678' }
    };
    const t = TH[this.props.identidade] || TH['Original (verde)'];
    const base = 'height: 36px; padding: 0 14px; flex-shrink: 0; border-radius: 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; ';
    const on = base + 'border: 1.5px solid ' + t.primary + '; background: ' + t.primary + '; color: ' + t.onPrimary + ';';
    const off = base + 'border: 1.5px solid ' + t.lineStrong + '; background: ' + t.surface + '; color: ' + t.ink + ';';
    const todas = [
      { nome: 'Iogurte natural 170 g', cat: 'Laticínios', loja: 'Mercadinho Vila Nova', dist: '0,8 km', preco: 'R$ 3,14', de: 'R$ 4,49', desc: 30, vence: '28/10', livre: 12 },
      { nome: 'Presunto fatiado 200 g', cat: 'Frios', loja: 'Mercadinho Vila Nova', dist: '0,8 km', preco: 'R$ 6,90', de: 'R$ 11,50', desc: 40, vence: '30/10', livre: 6 },
      { nome: 'Biscoito recheado 140 g', cat: 'Doces', loja: 'Empório Santa Rita', dist: '1,4 km', preco: 'R$ 2,39', de: 'R$ 3,19', desc: 25, vence: '29/10', livre: 18 },
      { nome: 'Molho de tomate 300 g', cat: 'Mercearia', loja: 'Mercado Dois Irmãos', dist: '2,1 km', preco: 'R$ 1,95', de: 'R$ 3,90', desc: 50, vence: '05/11', livre: 9 }
    ];
    const faixaOk = (d) => this.state.faixa === 'Todas' || (this.state.faixa === 'Até 30%' && d <= 30) || (this.state.faixa === '30–50%' && d > 30 && d < 50) || (this.state.faixa === '50%+' && d >= 50);
    const ofertas = todas.filter((o) => (this.state.cat === 'Todos' || o.cat === this.state.cat) && faixaOk(o.desc));
    return {
      t: t,
      cats: ['Todos', 'Mercearia', 'Enlatados', 'Laticínios', 'Leite', 'Frios', 'Doces'].map((c) => ({ label: c, on: this.state.cat === c, style: this.state.cat === c ? on : off, pick: () => this.setState({ cat: c }) })),
      faixas: ['Todas', 'Até 30%', '30–50%', '50%+'].map((f) => ({ label: f, on: this.state.faixa === f, style: (this.state.faixa === f ? on : off) + ' height: 32px; font-size: 13px;', pick: () => this.setState({ faixa: f }) })),
      ofertas: ofertas,
      total: ofertas.length
    };
  }
}
</script>
</body>
</html>
